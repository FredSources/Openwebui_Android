# build-apk-submodule.yml — CI/CD v2 « source d'origine + diffs »
# Build les APK debug + release sur un tag v* (ex. v0.0.80_beta) et publie
# la Release GitHub avec les APK attachés.
#
# Chaîne v2 (voir REFONTE.md) — diffère de v1 UNIQUEMENT sur l'amont :
#   1. checkout avec `submodules: recursive` (open-webui v0.13.4 + searxng figé)
#      → ni fetch_src.sh (wheel PyPI), ni clonage SearXNG à la volée ;
#   2. scripts/apply_patches.sh : 33 patchs backend en diff → src/open_webui/,
#      patch frontend (Audio.svelte) → submodule, compléments (shims + searx) ;
#   3. frontend RECOMPILÉ depuis les sources Svelte (npm ci + npm run build)
#      → copié vers src-assets/frontend (en v1 : chunks pré-compilés committés).
# Le reste de la chaîne APK est IDENTIQUE à v1 : SDK/Gradle installés dans le
# projet, Chaquopy, versionCode auto, signature, vérifications (_app/, check_apk).
#
# RAM : `npm run build` d'Open WebUI impose --max-old-space-size=12288 (12 Go)
# alors que le runner en a 7 → swap 8 Go ajouté avant le build frontend.
#
# Signature release : secrets GitHub KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
# KEY_ALIAS / KEY_PASSWORD — sinon clé debug (tests).

name: Build APK (submodule + patches)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # build.gradle attend un CPython 3.13 à .venv313/bin/python3 (buildPython)
      - name: Environnement Python du projet
        run: |
          python3.13 -m venv .venv313
          .venv313/bin/pip install -q --upgrade pip setuptools wheel

      # --- Amont v2 : source vierge (submodule) + patchs en diff -------------
      - name: Sources patchées (submodule + diffs)
        run: |
          bash scripts/apply_patches.sh
          echo "backend : $(find src/open_webui -name '*.py' | wc -l) fichiers .py"
          # la cible Chaquopy + les compléments doivent exister
          test -d src/open_webui
          test -d src/searx
          test -f src/tiktoken.py
          test -f src/re2.py
          # le patch frontend doit avoir été appliqué dans le submodule
          grep -q "PROVIDER === 'android'" \
            vendor/open-webui/src/lib/components/admin/Settings/Audio.svelte

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vendor/open-webui/package-lock.json

      # --- Amont v2 : frontend recompilé depuis les sources Svelte -----------
      - name: Frontend (npm ci + build dans le submodule)
        env:
          # onnxruntime-node tente de télécharger les binaires CUDA EP au
          # postinstall (URL GitHub en 404, runner sans GPU) — skip inoffensif
          # pour un build de frontend (vérifié : lu via env var par install.js)
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          # swap : le script de build d'Open WebUI tourne avec
          # --max-old-space-size=12288 alors que le runner a 7 Go de RAM.
          # Le runner peut déjà avoir un swap actif sur /swapfile (fallocate
          # dessus = « Text file busy ») : on n'ajoute un swap à nous que si
          # le total est insuffisant, sur un fichier distinct.
          TOTAL=$(awk '/SwapTotal/ {print $2}' /proc/meminfo)
          echo "swap actif : $((TOTAL / 1024)) Mo"
          if [ "$TOTAL" -lt 8388608 ]; then
            F=/swapfile-openwebui
            if ! swapon --show=NAME --noheadings | grep -q "$F"; then
              sudo fallocate -l 8G "$F"
              sudo chmod 600 "$F"
              sudo mkswap "$F" >/dev/null
              sudo swapon "$F"
            fi
          fi
          swapon --show
          cd vendor/open-webui
          npm ci --no-audit --no-fund
          npm run build
          cd ../..
          # sortie : vendor/open-webui/build -> assets Android (src-assets/frontend)
          rm -rf src-assets/frontend
          mkdir -p src-assets/frontend
          cp -a vendor/open-webui/build/. src-assets/frontend/
          echo "fichiers _app/ : $(find src-assets/frontend/_app -type f | wc -l)"

      # --- Chaîne APK (identique à v1) ---------------------------------------
      - name: Adaptation CI x86_64 (aapt2 natif, pas de qemu)
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: Téléchargements (cmdline-tools, Gradle)
        run: |
          mkdir -p downloads
          # zips mis en cache : téléchargés une seule fois (le CDN officiel peut
          # saturer en 504 — chaîne de secours via miroirs + test d'intégrité)
          [ -s downloads/cmdline-tools.zip ] || curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o downloads/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          if [ ! -s downloads/gradle.zip ]; then
            for u in \
              https://services.gradle.org/distributions/gradle-8.10.2-bin.zip \
              https://mirrors.cloud.tencent.com/gradle/gradle-8.10.2-bin.zip \
              https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.10.2-bin.zip; do
              echo "tentative : $u"
              curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors -o downloads/gradle.zip "$u" && break
              rm -f downloads/gradle.zip
            done
          fi
          unzip -t downloads/cmdline-tools.zip >/dev/null && echo "cmdline-tools.zip valide"
          unzip -t downloads/gradle.zip >/dev/null && echo "gradle.zip valide"

      - name: Cache Gradle + SDK
        uses: actions/cache@v4
        with:
          path: |
            .gradle-cache
            android-sdk
            tools/gradle
            downloads
          key: build-${{ runner.os }}-${{ hashFiles('gradle.properties', 'app/build.gradle') }}

      - name: SDK + Gradle (installés dans le projet)
        run: bash scripts/setup-sdk.sh

      - name: versionCode (numéro d'exécution)
        run: echo $((10000 + GITHUB_RUN_NUMBER)) > version_code

      - name: Keystore de release (si secrets présents)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          else
            echo "Aucun keystore : release signé avec la clé debug (installable, tests)."
          fi

      - name: Build APK debug + release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/build.sh assembleDebug assembleRelease

      - name: Vérification des APK produits
        run: |
          ls -la dist/
          test -f dist/OpenWebUI_Android-*-debug.apk
          test -f dist/OpenWebUI_Android-*-release.apk
          # Garde-fou P20 : le motif ignoreAssetsPattern par défaut d'Android
          # (<dir>_*) supprime les DOSSIERS d'assets à underscore — le dossier
          # _app/ (JS de l'UI) avait ainsi disparu d'un APK livré. Tout APK
          # sans les ~927 fichiers _app/ est rejeté ici.
          N=$(unzip -l dist/OpenWebUI_Android-*-release.apk | grep -c 'assets/frontend/_app/')
          echo "fichiers _app/ dans l'APK : $N"
          test "$N" -gt 500

      - name: Vérification de la chaîne APK
        run: python3 scripts/check_apk.py dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: openwebui-android-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Corps de release (versions embarquées)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p .tmp
          OW=$(git -C vendor/open-webui describe --tags --exact-match 2>/dev/null || echo "v0.13.4")
          SX=$(git -C vendor/searxng rev-parse --short=7 HEAD)
          TY=$(sed -n 's/^typst==\([0-9.]*\).*/\1/p' requirements-min.txt | head -1)
          {
            echo "## Composants embarqués"
            echo ""
            echo "| Composant | Version |"
            echo "|---|---|"
            echo "| Open WebUI | \`$OW\` (submodule) |"
            echo "| SearXNG | \`$SX\` (submodule figé) |"
            echo "| Typst | $TY (compilateur .typ → PDF) |"
            echo "| Python | 3.13 (Chaquopy 17.2) |"
            echo "| Chaîne | submodule + patchs en diff (v2) |"
            echo ""
          } > .tmp/release-body.md
          cat .tmp/release-body.md

      - name: Release GitHub (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: .tmp/release-body.md
          generate_release_notes: true
