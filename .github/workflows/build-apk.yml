# build-apk.yml — CI/CD OpenWebUI Android
# Build les APK debug + release UNIQUEMENT sur un tag v* (git tag vX.Y.Z),
# et publie la Release GitHub avec les APK attachés.
#
# Particularités de la chaîne (voir docs/maintenance.typ) :
#   - sources Python patchées générées par scripts/prepare_src.py (P1–P18)
#   - SearXNG vendor figé (commit a30b2d4749) cloné ici
#   - wheels Rust cross-buildés déjà committés dans wheels/ (pas de rebuild CI)
#   - gradle.properties : la surcharge aapt2/qemu (aarch64) est retirée — le
#     runner x86_64 exécute aapt2 nativement
#   - versionCode = 10000 + numéro d'exécution (installable par-dessus les
#     builds précédents)
#
# Signature release : créer les secrets GitHub
#   KEYSTORE_BASE64 (keystore JKS en base64), KEYSTORE_PASSWORD, KEY_ALIAS,
#   KEY_PASSWORD — sinon l'APK release est signé avec la clé debug (tests).

name: Build APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # build.gradle attend un CPython 3.13 à .venv313/bin/python3 (buildPython)
      - name: Environnement Python du projet
        run: |
          python3.13 -m venv .venv313
          .venv313/bin/pip install -q --upgrade pip setuptools wheel

      - name: SearXNG vendor (commit figé)
        run: |
          git clone --quiet https://github.com/searxng/searxng.git vendor/searxng
          git -C vendor/searxng checkout -q a30b2d47492ab46ae82ce25ee62a31626565cf67

      - name: Sources Open WebUI amont (wheel PyPI)
        run: bash scripts/fetch_src.sh

      - name: Adaptation CI x86_64 (aapt2 natif, pas de qemu)
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: Téléchargements (cmdline-tools, Gradle)
        run: |
          mkdir -p downloads
          # zips mis en cache : téléchargés une seule fois (le CDN sature parfois
          # en 504 — ne jamais re-télécharger ce qui est déjà présent)
          [ -s downloads/cmdline-tools.zip ] || curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o downloads/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          [ -s downloads/gradle.zip ] || curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o downloads/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

      - name: Cache Gradle + SDK
        uses: actions/cache@v4
        with:
          path: |
            .gradle-cache
            android-sdk
            tools/gradle
            downloads
          key: build-${{ runner.os }}-${{ hashFiles('gradle.properties', 'app/build.gradle') }}

      - name: SDK + Gradle (installés dans le projet)
        run: bash scripts/setup-sdk.sh

      - name: versionCode (numéro d'exécution)
        run: echo $((10000 + GITHUB_RUN_NUMBER)) > version_code

      - name: Keystore de release (si secrets présents)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          else
            echo "Aucun keystore : release signé avec la clé debug (installable, tests)."
          fi

      - name: Build APK debug + release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/build.sh assembleDebug assembleRelease

      - name: Vérification des APK produits
        run: |
          ls -la dist/
          test -f dist/OpenWebUI_Android-*-debug.apk
          test -f dist/OpenWebUI_Android-*-release.apk
          # Garde-fou P20 : le motif ignoreAssetsPattern par défaut d'Android
          # (<dir>_*) supprime les DOSSIERS d'assets à underscore — le dossier
          # _app/ (JS de l'UI) avait ainsi disparu d'un APK livré. Tout APK
          # sans les ~927 fichiers _app/ est rejeté ici.
          N=$(unzip -l dist/OpenWebUI_Android-*-release.apk | grep -c 'assets/frontend/_app/')
          echo "fichiers _app/ dans l'APK : $N"
          test "$N" -gt 500

      - uses: actions/upload-artifact@v4
        with:
          name: openwebui-android-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Corps de release (versions embarquées)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p .tmp
          OW=$(sed -n 's/.*OPEN_WEBUI_VERSION:-\([0-9.]*\).*/\1/p' scripts/fetch_src.sh | head -1)
          SX=$(git -C vendor/searxng rev-parse --short=7 HEAD)
          {
            echo "## Composants embarqués"
            echo ""
            echo "| Composant | Version |"
            echo "|---|---|"
            echo "| Open WebUI | $OW |"
            echo "| SearXNG | \`$SX\` (commit figé) |"
            echo "| Python | 3.13 (Chaquopy 17.2) |"
            echo ""
          } > .tmp/release-body.md
          cat .tmp/release-body.md

      - name: Release GitHub (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: .tmp/release-body.md
          generate_release_notes: true
