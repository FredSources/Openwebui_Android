// app/build.gradle — module applicatif (Chaquopy = Python embarqué)
plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'org.openwebui.android'
    compileSdk 34

    defaultConfig {
        applicationId 'org.openwebui.android'
        minSdk 24
        targetSdk 34
        // versionCode incrémenté à chaque build (scripts/build.sh, -Pvcode) :
        // MainActivity s'en sert pour purger le cache WebView quand l'UI change
        def vcodeStr = project.hasProperty('vcode') ? project.property('vcode') : '1'
        versionCode vcodeStr.toString().toInteger()
        versionName '0.0.52'

        // Python = composant natif : arm64-v8a couvre tous les téléphones récents
        ndk {
            abiFilters 'arm64-v8a'
        }

        python {
            // doit correspondre au major.minor de buildPython
            version '3.13'
            // python 3.13 du projet (isolation : rien hors du dépôt)
            buildPython "${rootDir}/.venv313/bin/python3"

            // P16 : Alembic lit migrations/*.py comme des fichiers — les .py
            // doivent rester sur disque malgré la compilation bytecode
            // + searx : settings.yml, locales et static doivent être sur disque
            extractPackages "open_webui.migrations", "open_webui.migrations.versions", "searx"

            pip {
                // wheels Android cross-buildés localement (pydantic-core, jiter)
                options '--find-links', "${rootDir}/wheels"
                install '-r', "${rootDir}/requirements-min.txt"
            }
        }
    }

    // Sources Python : notre copie patchée (src/open_webui) + shims (tiktoken, pycrdt)
    // Assets : frontend lourd (src-assets/frontend) extrait par MainActivity — cf. P15
    sourceSets {
        main {
            python.srcDirs = ['src/main/python', "${rootDir}/src"]
            assets.srcDirs += ["${rootDir}/src-assets"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Signature release : keystore fourni par variables d'environnement (CI/CD,
    // secrets GitHub KEYSTORE_FILE/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD) ;
    // sans keystore, repli sur la clé debug (APK installable, pour tests)
    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            // extraire les .so sur le système de fichiers (ctypes / page size 16 Ko)
            useLegacyPackaging = true
        }
    }

    // P20 : le motif ignoreAssetsPattern PAR DÉFAUT d'Android contient <dir>_* :
    // tout DOSSIER d'assets dont le nom commence par "_" est supprimé silencieusement
    // du packaging. Le dossier _app/ du frontend SvelteKit (TOUS les .js de l'UI)
    // disparaissait donc de l'APK → écran de chargement figé. Motif personnalisé,
    // identique au défaut SANS <dir>_*. Vérifié en CI (comptage assets/frontend/_app/).
    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}
