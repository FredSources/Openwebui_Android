<!doctype html><html><body><div id="out">EN_COURS</div>
<script>
const out=document.getElementById('out'),log=[];
function report(){const t=log.join(' | ');out.textContent=t;
  fetch('http://127.0.0.1:8092/report',{method:'POST',mode:'no-cors',body:t}).catch(()=>{});}
let w=new Worker('/_app/immutable/workers/pyodide.worker-DShhgMin.js',{type:'module'});
let step=0,t0=0;
w.onmessage=e=>{const d=e.data||{};
  if(d.type&&String(d.type).startsWith('fs:')){if(d.id==='__prewarm'&&step===0){step=1;log.push('BOOT_OK');
    t0=performance.now();w.postMessage({type:'execute',id:'a',code:'2+2'});}return;}
  if(d.id==='a'){log.push('T1='+Math.round(performance.now()-t0)+'ms res='+d.result);
    t0=performance.now();w.postMessage({type:'execute',id:'b',code:'print("hello")'});}
  else if(d.id==='b'){log.push('T2='+Math.round(performance.now()-t0)+'ms stdout='+JSON.stringify(d.stdout));report();}
};
w.onerror=e=>{log.push('ERREUR_WORKER '+e.message);report();};
w.postMessage({type:'fs:sync',id:'__prewarm'});
</script></body></html>
