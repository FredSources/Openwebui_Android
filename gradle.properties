# gradle.properties — mémoire limitée (environnement 11 Go / proot)
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=false
android.useAndroidX=false
android.nonTransitiveRClass=true
# aapt2 officiel = binaire x86_64 : exécuté via qemu (machine aarch64, journal D9)
android.aapt2FromMavenOverride=/root/openwebui-android/tools/wrappers/aapt2
